<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManagerBills - Navegación y Menú de Perfil (HU-008)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../prototype.css">
  <style>
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: var(--card-bg); border-right: 1px solid var(--glass-border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar a { display: block; padding: 0.6rem 0.75rem; border-radius: 0.5rem; color: var(--text-muted); text-decoration: none; }
    .sidebar a.active { background: var(--accent); color: #fff; }
    .content { flex: 1; padding: 2rem; }
    .profile-menu { position: relative; display: inline-block; }
    .profile-menu-dropdown { position: absolute; top: 2.5rem; right: 0; background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 0.5rem; padding: 0.5rem; min-width: 160px; }
    .profile-menu-dropdown a { display: block; padding: 0.5rem 0.75rem; color: var(--text-main); text-decoration: none; border-radius: 0.375rem; }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <a class="active" href="#">Dashboard</a>
      <a href="#">Usuarios</a>
      <a href="#">Configuración</a>
    </nav>
    <main class="content">
      <header class="app-header" style="justify-content:flex-end;">
        <div class="profile-menu">
          <button style="background:none;border:none;color:var(--text-main);cursor:pointer;">Kevin ▾</button>
          <div class="profile-menu-dropdown">
            <a href="#">Configuración</a>
            <a href="#">Cerrar sesión</a>
          </div>
        </div>
      </header>
      <h1>Dashboard</h1>
    </main>
  </div>
</body>
</html>
